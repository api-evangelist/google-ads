          items:
            $ref: '#/components/schemas/GoogleAdsGoogleadsV25Common__KeywordConcept'
    GoogleAdsGoogleadsV25Services__GclidDateTimePair:
      description: Uniquely identifies a conversion that was reported without an order ID specified.
