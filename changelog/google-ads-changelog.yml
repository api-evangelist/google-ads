      - GENERATE_LANDING_PAGE_TEXT asset automation for Demand Gen video ads
      - Local Services Ads support in Performance Max campaigns
      - New experiment types COMPARE_CAMPAIGNS and PMAX_TEXT_CUSTOMIZATION_FINAL_URL_EXPANSION
      - Multi-Party Authorization review expanded (beta)
      - Creator insights searchable by topic, plus local creator data
  - version: v24.1
    date: '2026-05-13'
    type: minor
    breaking: false
    highlights:
      - classic_display_images field for custom Demand Gen display images
      - Four new experiment types for optimization testing
      - passkey_enabled field added to CustomerUserAccess
      - mobile_device_platform segment for device-based reporting
  - version: v24
    date: '2026-04-22'
