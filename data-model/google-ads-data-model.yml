patterns:
  - name: link objects are resources
    note: >-
      CampaignAsset, AdGroupAsset, CustomerAsset, AssetGroupAsset, CampaignLabel,
      AdGroupLabel, AdGroupAdLabel, CampaignSharedSet and SharedCriterion each exist as a
      standalone resource with its own :mutate operation, rather than as a nested array on
      the parent. Roughly a third of the write surface is link management.
  - name: views are read-only resources
    note: >-
      Many *View schemas (AdGroupAdAssetCombinationView, CartDataSalesView,
      AdGroupSimulation) exist only as GAQL FROM targets. They have no mutate operation and
      no resource name you can create.
  - name: micros
    note: >-
      Every monetary field is an int64 of micros (1,000,000 micros = one unit of the
      account currency), serialised as a string in the REST transport. Reading them as
      floats is the most common integration bug on this API.
