provider: Google Ads
providerId: google-ads
description: >-
  Entity graph for the Google Ads API. Every object is addressed by an opaque hierarchical
  RESOURCE NAME, not by a bare id, and every resource name is rooted at a customer:
  customers/{customer_id}/campaigns/{campaign_id}. That root is the practical blast radius
  of a credential — an agent holding the adwords scope operates on whichever customer id
  it puts in the path. Link objects (CampaignAsset, AdGroupAsset, CampaignLabel) are
  first-class resources rather than arrays on the parent, which is why the surface has so
  many :mutate operations.
