coverage:
  mcp_tools: 3
  mcp_resources: 4
  rest_operations: 174
  rest_operations_bound: 5
  rest_operations_unbound: 169
  tools_bound: 3
  tools_unbound: 0
  bound_percent_of_rest: 2.9
  note: >-
    Low REST coverage here is a design choice, not a gap in the crosswalk. One GAQL
    `search` tool reaches every readable resource in the schema, which no per-operation
    count captures. What the numbers do capture correctly is that no mutate operation is
    reachable from an agent through Google's MCP server.
