generated: '2026-08-13'
method: derived
source: >-
  mcp/google-ads-mcp.yml (tool signatures read from ads_mcp/tools/*.py in
  github.com/googleads/google-ads-mcp) bound to operationIds in
  openapi/google-ads-api-v25-openapi.yml, which was converted from
  https://googleads.googleapis.com/$discovery/rest?version=v25
description: >-
  Binds every tool in Google's first-party MCP server to the REST operation that backs
  it, so an agent inherits a real inputSchema instead of a guessed one. The headline
  finding is the asymmetry: three read-only tools cover 174 REST operations, and every
  one of the ~140 mutate operations is rest_only. The MCP surface is a reporting
  surface; the REST surface is the control plane.

surfaces:
  openapi:
    path: openapi/google-ads-api-v25-openapi.yml
    operations: 174
    gated: false
    note: >-
      Derived by mechanical conversion of the public Google API Discovery Document.
      Calling any operation requires OAuth plus a developer token; the CONTRACT is
      anonymous-readable, the API is not.
  discovery:
    path: discovery/google-ads-api-v25-discovery.json
    url: https://googleads.googleapis.com/$discovery/rest?version=v25
    gated: false
  mcp:
    url: null
    install: pipx run --spec git+https://github.com/googleads/google-ads-mcp.git google-ads-mcp
    mode: local-stdio
    gated: true
    note: >-
      No hosted endpoint exists, so tools/list could not be introspected over the wire.
      Tool names, descriptions and parameters were read from Google's own published
      source (ads_mcp/tools/core.py, search.py, get_resource_metadata.py), which is a
      stronger source than a docs list — the signatures below are the actual Python
      function signatures FastMCP turns into inputSchema.
  graphql:
    endpoint: null
    note: >-
      graphql/google-ads-graphql.md in this repo documents a modelling exercise, not a
      Google-served GraphQL endpoint. Google publishes no GraphQL API for Google Ads.

crosswalk:
  - tool: list_accessible_customers
    category: customers
    rest:
      - googleads_customers_listAccessibleCustomers
    binding: direct
    confidence: high
    note: >-
      Calls CustomerService.ListAccessibleCustomers and strips the "customers/" prefix
      from each returned resource name. GET v25/customers:listAccessibleCustomers.
  - tool: search
    category: search
    rest:
      - googleads_customers_googleAds_searchStream
      - googleads_customers_googleAds_search
    binding: composite
    confidence: high
    note: >-
      The tool assembles a GAQL string (SELECT fields FROM resource [WHERE conditions]
      [ORDER BY orderings] [LIMIT n] PARAMETERS omit_unselected_resource_names=true) and
      executes it against SearchStream (POST v25/customers/{customersId}/googleAds:searchStream).
      The non-streaming googleAds:search operation takes the identical query and is the
      paginated equivalent, so both are listed. The tool's structured field/resource/
      conditions arguments are a constrained front end over the query string in
      SearchGoogleAdsStreamRequest — the tool cannot express every GAQL clause the REST
      operation accepts.
  - tool: get_resource_metadata
    category: metadata
    rest:
      - googleads_googleAdsFields_search
      - googleads_googleAdsFields_get
    binding: composite
    confidence: high
    note: >-
      Issues two GoogleAdsFieldService queries — one for ATTRIBUTE fields matching
      "<resource>.%" and one for the compatible metrics and segments — and merges them
      into a single selectable/filterable/sortable response. POST v25/googleAdsFields:search.

