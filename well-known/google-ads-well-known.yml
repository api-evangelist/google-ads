findings:
  - >-
    The Google Ads API host publishes no machine-readable discovery surface at
    /.well-known/. Everything an agent needs to bootstrap the API — the base URL, the
    OAuth endpoints, the operation surface — comes from the Google API Discovery
    Document at https://googleads.googleapis.com/$discovery/rest?version=v25, which is
    the real first-party contract for this API (saved to discovery/).
  - >-
    No A2A Agent Card is served on any Google Ads host. No a2a/ artifact was written.
