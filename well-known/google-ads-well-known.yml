source: live HTTP probes of every apis.yml baseURL host, every OpenAPI servers[] host, the docs host and the OAuth host named in the OpenAPI securityScheme
description: >-
  Well-known discovery probe for Google Ads. The API host itself
  (googleads.googleapis.com) serves NO /.well-known/ documents — every path returns
  404. The OAuth surface the Google Ads API delegates to (accounts.google.com, named
  as the authorizationUrl in the OpenAPI securityScheme) does serve a real OIDC
  discovery document and RFC 8414 authorization-server metadata, and google.com serves
  a real RFC 9116 security.txt. All three hosts are Google-controlled.
