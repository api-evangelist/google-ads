  productTypeL4: String
  productTypeL5: String
  quarter: Date
  searchSubcategory: String
  searchTerm: String
  searchTermMatchType: String
  slot: String
  week: Date
  year: Int
}

type BudgetCampaignAssociationStatus {
  campaignBudget: String
  status: String
}

type KeywordSegment {
  adGroupCriterion: String
  info: KeywordInfo
}

# ─── Auth ──────────────────────────────────────────────────────────────────────

type APIKey {
  keyId: ID!
  developerToken: String
  createdAt: DateTime
  lastUsedAt: DateTime
}

type Token {
  accessToken: String!
  tokenType: String
  expiresIn: Int
  refreshToken: String
  scope: String
}

# ─── Queries ───────────────────────────────────────────────────────────────────

type Query {
  """Retrieve a customer account by ID."""
  customer(customerId: ID!): Customer

  """List all accessible customer accounts."""
  customers: [CustomerSummary]

  """Retrieve an account budget."""
  accountBudget(resourceName: String!): AccountBudget

  """List account budgets for a customer."""
  accountBudgets(customerId: ID!): [AccountBudget]

  """Retrieve a billing setup."""
  billingSetup(resourceName: String!): BillingSetup

  """Retrieve invoices for a customer."""
  invoices(customerId: ID!, billingSetup: String!, issueYear: String!, issueMonth: Int!): [Invoice]

  """Retrieve a campaign."""
  campaign(resourceName: String!): Campaign

  """List campaigns for a customer."""
  campaigns(customerId: ID!, status: CampaignStatus): [Campaign]

  """Retrieve a campaign budget."""
  campaignBudget(resourceName: String!): CampaignBudget

  """List campaign budgets for a customer."""
  campaignBudgets(customerId: ID!): [CampaignBudget]

  """Retrieve an ad group."""
  adGroup(resourceName: String!): AdGroup

  """List ad groups for a customer or campaign."""
  adGroups(customerId: ID!, campaignId: ID, status: AdGroupStatus): [AdGroup]

  """Retrieve an ad group ad."""
  adGroupAd(resourceName: String!): AdGroupAd

  """List ads in an ad group."""
  adGroupAds(customerId: ID!, adGroupId: ID, status: AdStatus): [AdGroupAd]

  """Retrieve an ad group criterion (keyword, placement, etc.)."""
  adGroupCriterion(resourceName: String!): AdGroupCriterion

  """List ad group criteria."""
  adGroupCriteria(customerId: ID!, adGroupId: ID, type: String): [AdGroupCriterion]

  """Retrieve an asset."""
  asset(resourceName: String!): Asset

  """List assets for a customer."""
  assets(customerId: ID!, type: AssetType): [Asset]

  """Retrieve a keyword plan campaign."""
  keywordPlanCampaign(resourceName: String!): KeywordPlanCampaign

  """Retrieve a user list."""
  userList(resourceName: String!): UserList

  """List user lists for a customer."""
  userLists(customerId: ID!): [UserList]

  """Retrieve an audience."""
  audience(resourceName: String!): Audience

  """List audiences for a customer."""
  audiences(customerId: ID!): [Audience]

  """Retrieve a geo target constant."""
  geoTargetConstant(resourceName: String!): GeoTargetConstant

  """Search geo target constants."""
  geoTargetConstants(query: String, countryCode: String): [GeoTargetConstant]

  """Retrieve a language constant."""
  languageConstant(resourceName: String!): LanguageConstant

  """List all language constants."""
  languageConstants: [LanguageConstant]

  """Retrieve a bidding strategy."""
  biddingStrategy(resourceName: String!): BiddingStrategy

  """List bidding strategies for a customer."""
  biddingStrategies(customerId: ID!): [BiddingStrategy]

  """Retrieve a conversion action."""
  conversionAction(resourceName: String!): ConversionAction

  """List conversion actions for a customer."""
  conversionActions(customerId: ID!): [ConversionAction]

  """Retrieve a search term view."""
  searchTermView(resourceName: String!): SearchTermView

  """Execute a Google Ads Query Language (GAQL) report query."""
  report(customerId: ID!, query: String!, pageToken: String, pageSize: Int): Report
}

# ─── Mutations ─────────────────────────────────────────────────────────────────

type Mutation {
  """Create or update a campaign."""
  mutateCampaign(customerId: ID!, operation: CampaignOperation!): MutateCampaignsResponse

  """Create or update a campaign budget."""
  mutateCampaignBudget(customerId: ID!, operation: CampaignBudgetOperation!): MutateCampaignBudgetsResponse

  """Create or update an ad group."""
  mutateAdGroup(customerId: ID!, operation: AdGroupOperation!): MutateAdGroupsResponse

  """Create or update an ad group ad."""
  mutateAdGroupAd(customerId: ID!, operation: AdGroupAdOperation!): MutateAdGroupAdsResponse

  """Create or update an ad group criterion."""
  mutateAdGroupCriterion(customerId: ID!, operation: AdGroupCriterionOperation!): MutateAdGroupCriteriaResponse

  """Create or update an asset."""
  mutateAsset(customerId: ID!, operation: AssetOperation!): MutateAssetsResponse

  """Create or update a user list."""
  mutateUserList(customerId: ID!, operation: UserListOperation!): MutateUserListsResponse

  """Create or update a conversion action."""
  mutateConversionAction(customerId: ID!, operation: ConversionActionOperation!): MutateConversionActionsResponse

  """Create or update a bidding strategy."""
  mutateBiddingStrategy(customerId: ID!, operation: BiddingStrategyOperation!): MutateBiddingStrategiesResponse
}

# ─── Operation Inputs ──────────────────────────────────────────────────────────

input CampaignOperation {
  create: CampaignInput
  update: CampaignInput
  remove: String
  updateMask: String
}

input CampaignInput {
  resourceName: String
  name: String
  status: CampaignStatus
  advertisingChannelType: AdvertisingChannelType
  campaignBudget: String
  startDate: Date
  endDate: Date
  trackingUrlTemplate: String
  finalUrlSuffix: String
}

input CampaignBudgetOperation {
  create: CampaignBudgetInput
  update: CampaignBudgetInput
  remove: String
  updateMask: String
}

input CampaignBudgetInput {
  resourceName: String
  name: String
  amountMicros: Micros
  deliveryMethod: String
  explicitlyShared: Boolean
}

input AdGroupOperation {
  create: AdGroupInput
  update: AdGroupInput
  remove: String
  updateMask: String
}

input AdGroupInput {
  resourceName: String
  campaign: String
  name: String
  status: AdGroupStatus
  cpcBidMicros: Micros
  cpmBidMicros: Micros
  targetCpaMicros: Micros
  targetRoas: Float
}

input AdGroupAdOperation {
  create: AdGroupAdInput
  update: AdGroupAdInput
  remove: String
  updateMask: String
}

input AdGroupAdInput {
  resourceName: String
  adGroup: String
  status: AdStatus
  ad: AdInput
}

input AdInput {
  finalUrls: [String]
  displayUrl: String
  responsiveSearchAd: ResponsiveSearchAdInput
  expandedTextAd: ExpandedTextAdInput
}

input ResponsiveSearchAdInput {
  headlines: [AdTextAssetInput]
  descriptions: [AdTextAssetInput]
  path1: String
  path2: String
}

input ExpandedTextAdInput {
  headlinePart1: String
  headlinePart2: String
  headlinePart3: String
  description: String
  description2: String
  path1: String
  path2: String
}

input AdTextAssetInput {
  text: String!
  pinnedField: String
}

input AdGroupCriterionOperation {
  create: AdGroupCriterionInput
  update: AdGroupCriterionInput
  remove: String
  updateMask: String
}

input AdGroupCriterionInput {
  resourceName: String
  adGroup: String
  status: String
  keyword: KeywordInput
  cpcBidMicros: Micros
  negative: Boolean
}

input KeywordInput {
  text: String!
  matchType: KeywordMatchType!
}

input AssetOperation {
  create: AssetInput
  update: AssetInput
  remove: String
  updateMask: String
}

input AssetInput {
  resourceName: String
  name: String
  type: AssetType
  finalUrls: [String]
  textAsset: TextAssetInput
  imageAsset: ImageAssetInput
  sitelinkAsset: SitelinkAssetInput
  callAsset: CallAssetInput
}

input TextAssetInput { text: String! }
input ImageAssetInput { data: String; mimeType: String }
input SitelinkAssetInput { linkText: String!; description1: String; description2: String; finalUrls: [String] }
input CallAssetInput { countryCode: String!; phoneNumber: String! }

input UserListOperation {
  create: UserListInput
  update: UserListInput
  remove: String
  updateMask: String
}

input UserListInput {
  resourceName: String
  name: String
  description: String
  membershipLifeSpan: Long
  membershipStatus: String
}

input ConversionActionOperation {
  create: ConversionActionInput
  update: ConversionActionInput
  remove: String
  updateMask: String
}

input ConversionActionInput {
  resourceName: String
  name: String
  type: ConversionActionType
  status: String
  viewThroughLookbackWindowDays: Long
  clickThroughLookbackWindowDays: Long
}

input BiddingStrategyOperation {
  create: BiddingStrategyInput
  update: BiddingStrategyInput
  remove: String
  updateMask: String
}

input BiddingStrategyInput {
  resourceName: String
  name: String
  type: BiddingStrategyType
  targetCpa: TargetCPAInput
  targetRoas: TargetRoasInput
  maximizeConversions: MaximizeConversionsInput
  maximizeConversionValue: MaximizeConversionValueInput
}

input TargetCPAInput { targetCpaMicros: Micros; cpcBidCeilingMicros: Micros; cpcBidFloorMicros: Micros }
input TargetRoasInput { targetRoas: Float!; cpcBidCeilingMicros: Micros; cpcBidFloorMicros: Micros }
input MaximizeConversionsInput { targetCpaMicros: Micros }
input MaximizeConversionValueInput { targetRoas: Float }

