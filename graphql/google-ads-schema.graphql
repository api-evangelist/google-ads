"""
Google Ads GraphQL Schema
Conceptual schema derived from the Google Ads API v19 (REST + Proto/gRPC services).
Reference: https://developers.google.com/google-ads/api/reference/rpc
"""

# ─── Scalars ───────────────────────────────────────────────────────────────────

scalar DateTime
scalar Date
scalar Long
scalar Micros       # money amounts stored as micro-units (1/1,000,000 of the currency unit)
scalar JSON

