type MutateAdGroupAdResult { resourceName: String; adGroupAd: AdGroupAd }

type MutateAdGroupCriteriaResponse { results: [MutateAdGroupCriterionResult]; partialFailureError: String }
type MutateAdGroupCriterionResult { resourceName: String; adGroupCriterion: AdGroupCriterion }

type MutateAssetsResponse { results: [MutateAssetResult]; partialFailureError: String }
type MutateAssetResult { resourceName: String; asset: Asset }

type MutateUserListsResponse { results: [MutateUserListResult]; partialFailureError: String }
